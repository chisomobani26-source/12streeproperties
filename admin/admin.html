<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="Admin Dashboard" content="admin">

  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">

    <h1>Admin Dashboard</h1>

    <button id="logout-btn">
      Logout
    </button>

  </header>


  <main class="admin-container">

    <section class="admin-stats">

      <div class="admin-card">
        <h3>Total Properties</h3>
        <p id="total-properties">0</p>
      </div>

      <div class="admin-card">
        <h3>For Sale</h3>
        <p id="for-sale">0</p>
      </div>

      <div class="admin-card">
        <h3>For Rent</h3>
        <p id="for-rent">0</p>
      </div>

       

    </section>


    <section class="admin-properties">

      <div class="admin-title">

        <h2>Properties</h2>

        <button id="add-property">
          + Add Property
        </button>

      </div>


      <div id="admin-property-list">

        <!-- Properties will appear here -->

      </div>

    </section>

    <section id="edit-section" class="edit-section">

      <h2>Edit Property</h2>
    
      <form id="edit-form">
    
        <input
          type="text"
          id="edit-name"
          placeholder="Property name"
          required
        >

        <input type="text"
        id="edit-description"
        placeholder="description e.g luxury duplex apartment"
        required
        >
    
        <input
          type="text"
          id="edit-location"
          placeholder="Location"
          required
        >
        <!--pattern allows 1 to 3 digits at the start (e.g., 1, 10, 100). (,\d{3})* → allows groups of a comma followed by exactly 3 digits, repeated as needed (e.g., ,000, ,000,000).-->
      
        <input
          type="text"
          pattern="\d{1,3}(,\d{3}),
          id="edit-price"
          placeholder="Price"
          required
        >
    
        <select id="edit-type">
    
          <option value="Apartment">Apartment</option>
          <option value="House">House</option>
    
        </select>
    
        <select id="edit-status">
    
          <option value="For Sale">For Sale</option>
          <option value="For Rent">For Rent</option>
    
        </select>

        <input
        type="number"
        id="edit-bedrooms"
        placeholder="Bedrooms"
        required
      >
      
      <input
        type="number"
        id="edit-bathrooms"
        placeholder="Bathrooms"
        required
      >
      
      <input
        type="number"
        id="edit-parking"
        placeholder="Parking"
        required
      >

        <label for="edit-images">Property Images</label>

        <input
          type="file"
          id="edit-images"
          accept="image/*"
          multiple
        >

        <div id="edit-image-preview" class="edit-image-preview"></div>
    
        <button type="submit">
          Save Changes
        </button>
    
      </form>
    
    </section>
    <section id="add-section" class="edit-section">

      <h2>Add Property</h2>
    
      <form id="add-form">
    
        <input
          type="text"
          id="add-name"
          placeholder="Property name"
          required
        >

        <input type="text"
        id="add-description"
        placeholder="description e.g luxury duplex apartment"
        required
        >
    
        <input
          type="text"
          id="add-location"
          placeholder="Location"
          required
        >
    
        <input
          type="text"
          pattern="\d{1,3}(,\d{3})*" 
          id="add-price"
          placeholder="Price"
          required
        >
    
        <select id="add-type" required>
          <option value="">Select Type</option>
          <option value="Apartment">Apartment</option>
          <option value="House">House</option>
        </select>
    
        <select id="add-status" required>
          <option value="">Select Status</option>
          <option value="For Sale">For Sale</option>
          <option value="For Rent">For Rent</option>
        </select>
    
        <input
          type="number"
          id="add-bedrooms"
          placeholder="Bedrooms"
          required
        >
    
        <input
          type="number"
          id="add-bathrooms"
          placeholder="Bathrooms"
          required
        >
    
        <input
          type="number"
          id="add-parking"
          placeholder="Parking"
          required
        >
    
        <input
          type="file"
          id="add-image"
          accept="image/*"
          multiple
         required
       >
    
        <button type="submit">
          Add Property
        </button>
    
      </form>
    
    </section>

  </main>


  <script src="admin.js"></script>

</body>

</html>
