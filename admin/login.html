<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | 12 Street Property</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="login-container">

    <h1>Admin Login</h1>

    <p>12 Street Property</p>

    <form id="login-form">

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p id="login-message"></p>

    </form>

  </div>

  <script src="login.js"></script>

</body>

</html>
